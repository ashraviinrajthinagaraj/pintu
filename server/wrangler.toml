# Lets Cloudflare update the server by itself whenever this repository changes.
name = "pintu"
account_id = "95648b26cfb6dbb11b9e56fea8980798"
main = "worker.js"
compatibility_date = "2025-09-01"
# Anything added in Cloudflare's dashboard stays as it is. Secrets always do.
keep_vars = true

# Keeps the logs that are already switched on in Cloudflare.
[observability]
enabled = true

# The hub: live trips, road reports, convoys and morning alerts (server/hub.js).
# A SQLite Durable Object, which Cloudflare's free plan includes.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Every five minutes: morning alerts that are due, and tidying what's over.
[triggers]
crons = ["*/5 * * * *"]
