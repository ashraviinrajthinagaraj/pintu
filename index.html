<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pintu</title>
<meta name="description" content="Peta dan panduan suara untuk kita-kita sahaja.">
<meta name="theme-color" content="#0E1416">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pintu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map" aria-label="Peta" role="application"></div>
<div id="scrim" class="scrim" hidden></div>

<div id="map-problem" class="notice" hidden>
  <p id="map-problem-text"></p>
  <button id="map-retry" class="link-btn" type="button"></button>
</div>

<!-- Idle -->
<div id="hud" class="hud">
  <strong id="hud-clock" class="hud-clock"></strong>
  <button id="hud-prayer" class="pill pill-yellow" type="button" hidden></button>
  <button id="hud-range" class="pill" type="button" hidden></button>
  <div id="explore-row" class="explore-row" role="group">
    <button class="explore-chip" data-cat="sights" type="button"></button>
    <button class="explore-chip" data-cat="food" type="button"></button>
    <button class="explore-chip" data-cat="fuel" type="button"></button>
    <button class="explore-chip" data-cat="ev" type="button"></button>
    <button class="explore-chip" data-cat="hotel" type="button"></button>
  </div>
</div>
<main id="idle" class="dock">
  <div id="resume" class="resume" hidden>
    <p id="resume-text"></p>
    <div class="resume-actions">
      <button id="resume-no" class="link-btn" type="button"></button>
      <button id="resume-yes" class="plate plate-btn plate-small" type="button"></button>
    </div>
  </div>
  <div class="float-row">
    <button id="btn-settings" class="round" type="button"></button>
    <div class="float-col">
      <button id="btn-3d-idle" class="round round-text" type="button"></button>
      <button id="btn-locate" class="round" type="button"></button>
    </div>
  </div>
  <button id="car-pill" class="saved-btn car-pill" type="button" hidden><span id="car-pill-icon" class="saved-icon"></span><span class="saved-text"><strong id="car-pill-title"></strong><span id="car-pill-detail"></span></span></button>
  <div id="saved-row" class="saved-row">
    <button id="saved-home" class="saved-btn" type="button"><span id="saved-home-icon" class="saved-icon"></span><span class="saved-text"><strong id="saved-home-name"></strong><span id="saved-home-detail"></span></span></button>
    <button id="saved-work" class="saved-btn" type="button"><span id="saved-work-icon" class="saved-icon"></span><span class="saved-text"><strong id="saved-work-name"></strong><span id="saved-work-detail"></span></span></button>
  </div>
  <button id="where" class="plate plate-where" type="button">
    <span class="plate-glyph" id="where-glyph"></span>
    <span id="where-text"></span>
  </button>
</main>

<!-- Search -->
<section id="search" class="fullpanel" hidden>
  <div class="panel-head">
    <button id="search-back" class="icon-btn" type="button"></button>
    <input id="search-input" type="search" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search">
  </div>
  <div id="search-body" class="panel-body">
    <button id="search-paste" class="paste-row" type="button" hidden><span id="search-paste-icon"></span><span id="search-paste-label"></span></button>
    <div id="search-quick" class="search-quick" hidden>
      <button id="quick-here" class="quick" type="button"><span id="quick-here-icon"></span><span id="quick-here-label"></span></button>
      <button id="quick-map" class="quick" type="button"><span id="quick-map-icon"></span><span id="quick-map-label"></span></button>
    </div>
    <div id="search-status" class="search-status" role="status"></div>
    <ul id="search-results" class="place-list"></ul>
    <div id="recents-wrap" hidden>
      <div class="list-head">
        <h2 id="recents-title"></h2>
        <button id="recents-clear" class="link-btn" type="button"></button>
      </div>
      <ul id="recents" class="place-list"></ul>
    </div>
    <p id="search-tip" class="tip tip-pad"></p>
  </div>
</section>

<!-- Route preview -->
<section id="preview" class="sheet" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head trip-head">
    <button id="preview-back" class="icon-btn" type="button"></button>
    <div class="trip-ends">
      <button id="from-row" class="trip-end" type="button">
        <span class="trip-mark trip-mark-from" aria-hidden="true"></span>
        <span id="from-name" class="trip-name"></span>
      </button>
      <button id="to-row" class="trip-end" type="button">
        <span id="to-mark" class="trip-mark trip-mark-to" aria-hidden="true"></span>
        <span class="trip-name"><strong id="dest-name"></strong><span id="dest-detail"></span></span>
      </button>
    </div>
    <button id="swap-ends" class="icon-btn" type="button"></button>
  </div>
  <div class="mode-row">
    <div class="segmented" role="radiogroup" id="mode-group">
      <button id="mode-car" type="button" role="radio"></button>
      <button id="mode-moto" type="button" role="radio"></button>
      <button id="mode-walk" type="button" role="radio"></button>
    </div>
    <label class="switch" id="toll-wrap">
      <input id="avoid-tolls" type="checkbox">
      <span class="switch-track" aria-hidden="true"></span>
      <span id="avoid-tolls-label"></span>
    </label>
  </div>
  <div id="route-status" class="route-status" role="status"></div>
  <ul id="route-list" class="route-list"></ul>
  <div id="preview-strip" class="strip strip-preview" aria-hidden="true" hidden></div>

  <div id="plan" class="plan" hidden>
    <div id="plan-stops" class="plan-stops"></div>
    <div id="plan-fuel" class="plan-row plan-fuel">
      <span class="plan-icon" id="plan-fuel-icon"></span>
      <div class="plan-main">
        <strong id="plan-fuel-title"></strong>
        <span id="plan-fuel-detail"></span>
        <div id="plan-level-row" class="level-row" hidden>
          <input id="plan-level" type="range" min="0" max="100" step="5">
          <output id="plan-level-value"></output>
        </div>
      </div>
      <button id="plan-fuel-edit" class="link-btn" type="button"></button>
    </div>
    <div id="plan-arrive" class="plan-row">
      <span class="plan-icon" id="plan-arrive-icon"></span>
      <label class="plan-main" for="plan-arrive-time"><strong id="plan-arrive-title"></strong><span id="plan-arrive-detail"></span></label>
      <input id="plan-arrive-time" class="time-input" type="time">
    </div>
    <div id="plan-parking-wrap" hidden>
      <div class="plan-row">
        <span class="plan-icon" id="plan-parking-icon"></span>
        <button id="plan-parking" class="plan-main plan-main-btn" type="button" aria-expanded="false"><strong id="plan-parking-title"></strong><span id="plan-parking-detail"></span></button>
        <button id="plan-parking-clear" class="icon-btn" type="button" hidden></button>
      </div>
      <ul id="parking-list" class="parking-list" hidden></ul>
    </div>
    <button id="plan-weather" class="plan-row" type="button" hidden>
      <span id="plan-weather-icon" class="plan-icon"></span>
      <span class="plan-main"><strong id="plan-weather-title"></strong><span id="plan-weather-detail"></span></span>
      <span id="plan-weather-chev" class="plan-chev"></span>
    </button>
    <button id="plan-mall" class="plan-row" type="button" hidden>
      <span id="plan-mall-icon" class="plan-icon"></span>
      <span class="plan-main"><strong id="plan-mall-title"></strong><span id="plan-mall-detail"></span></span>
      <span id="plan-mall-chev" class="plan-chev"></span>
    </button>
    <button id="plan-prayer" class="plan-row" type="button" hidden>
      <span class="plan-icon" id="plan-prayer-icon"></span>
      <span class="plan-main"><strong id="plan-prayer-title"></strong><span id="plan-prayer-detail"></span></span>
      <span class="plan-chev" id="plan-prayer-chev"></span>
    </button>
  </div>

  <p id="route-note" class="tip tip-note"></p>
  <!-- Always on screen, however much the rest has to scroll. -->
  <div class="action-bar">
    <div class="action-row">
      <button id="add-stop" class="action-side" type="button" disabled>
        <span id="add-stop-icon" class="action-icon"></span><span id="add-stop-label"></span>
      </button>
      <button id="start" class="plate plate-btn" type="button" disabled></button>
    </div>
    <button id="try-sim" class="link-btn center" type="button"></button>
  </div>
</section>

<!-- Choose a starting point on the map -->
<section id="map-pick" hidden>
  <div class="pick-pin" id="pick-pin" aria-hidden="true"></div>
  <div class="pick-bar">
    <button id="pick-back" class="icon-btn" type="button"></button>
    <p id="pick-hint"></p>
    <button id="pick-use" class="plate plate-btn plate-small" type="button"></button>
  </div>
</section>

<!-- Navigation -->
<section id="nav" hidden>
  <div id="nav-top" class="nav-top">
    <button id="sign" class="plate sign" type="button">
      <span id="sign-icon" class="sign-icon"></span>
      <span class="sign-text">
        <span id="sign-distance" class="sign-distance"></span>
        <span id="sign-action" class="sign-action"></span>
        <span class="sign-road"><span id="sign-ref" class="shield" hidden></span><span id="sign-road"></span></span>
        <span id="sign-toward" class="sign-toward" hidden></span>
      </span>
    </button>
    <div id="lanes" class="lanes" aria-hidden="true" hidden></div>
    <div id="junction" class="junction" aria-hidden="true" hidden>
      <div class="junction-head"><div id="junction-board" class="junction-board"><span id="junction-exit" class="junction-exit"></span><span id="junction-to"></span></div></div>
      <div id="junction-pic" class="junction-pic"></div>
      <div class="junction-bar"><div id="junction-fill"></div></div>
    </div>
    <div class="nav-under">
      <div id="sign-then" class="then" hidden>
        <span id="then-label"></span><span id="then-icon" class="then-icon"></span>
      </div>
      <div id="chips" class="chips" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="nav-left">
    <div id="speed-limit" class="limit-sign" hidden></div>
    <div id="speed" class="speed" hidden><strong id="speed-value"></strong><span id="speed-unit"></span></div>
    <div id="camera-alert" class="camera-alert" role="status" hidden><span id="camera-icon" class="camera-icon"></span><span id="camera-distance"></span><span id="camera-limit" class="camera-limit" hidden></span></div>
    <div id="nav-range" class="range-pill" hidden></div>
  </div>
  <div class="nav-float">
    <button id="btn-hud" class="round round-text round-hud" type="button"></button>
    <button id="btn-3d" class="round round-text" type="button"></button>
    <button id="btn-mute" class="round" type="button"></button>
    <button id="btn-add-stop" class="round" type="button"></button>
    <button id="btn-recenter" class="round round-accent" type="button" hidden></button>
  </div>
  <div id="refill" class="refill" hidden>
    <p id="refill-text"></p>
    <div class="resume-actions">
      <button id="refill-no" class="link-btn" type="button"></button>
      <button id="refill-yes" class="plate plate-btn plate-small" type="button"></button>
    </div>
  </div>
  <div id="nav-bar" class="nav-bar">
    <div id="sim-panel" class="sim-panel" hidden>
      <button id="sim-play" class="sim-btn" type="button"></button>
      <div id="sim-speeds" class="segmented sim-speeds" role="radiogroup"></div>
      <button id="sim-next" class="sim-btn" type="button"></button>
      <button id="sim-list" class="sim-btn" type="button"></button>
    </div>
    <div class="strip-wrap">
      <div id="nav-strip" class="strip" aria-hidden="true"></div>
      <!-- In a simulated drive, the trip line is what you drag to go anywhere. -->
      <div id="sim-seek" class="strip-seek" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden></div>
    </div>
    <div class="nav-bar-row">
      <div class="nav-eta">
        <strong id="eta-clock"></strong>
        <span id="eta-rest"></span>
      </div>
      <button id="btn-end" class="end-btn" type="button"></button>
    </div>
  </div>
</section>

<!-- Choose a stop -->
<section id="stops" class="sheet sheet-stops" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <button id="stops-back" class="icon-btn" type="button"></button>
    <div class="dest-title"><h2 id="stops-title"></h2></div>
  </div>
  <div id="stops-cats" class="cats" role="radiogroup"></div>
  <ul id="stops-list" class="place-list stops-list"></ul>
  <div id="stops-status" class="route-status" role="status"></div>
  <button id="stops-other" class="link-btn center" type="button"></button>
</section>

<!-- Places nearby -->
<section id="explore" class="sheet sheet-stops" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <button id="explore-back" class="icon-btn" type="button"></button>
    <div class="dest-title"><h2 id="explore-title"></h2><p id="explore-where"></p></div>
  </div>
  <div id="explore-cats" class="cats" role="radiogroup"></div>
  <ul id="explore-list" class="place-list stops-list"></ul>
  <div id="explore-status" class="route-status" role="status"></div>
</section>

<!-- A place tapped on the map -->
<section id="placecard" class="sheet sheet-auto" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <button id="placecard-back" class="icon-btn" type="button"></button>
    <div class="dest-title"><h2 id="placecard-name"></h2><p id="placecard-detail"></p></div>
  </div>
  <button id="placecard-go" class="plate plate-btn sheet-action" type="button"></button>
</section>

<!-- Where the car is -->
<section id="car" class="sheet sheet-auto" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <button id="car-back" class="icon-btn" type="button"></button>
    <div class="dest-title"><h2 id="car-title"></h2><p id="car-detail" class="car-detail"></p></div>
  </div>
  <div id="car-note-wrap">
    <label id="car-note-label" class="field-label" for="car-note"></label>
    <input id="car-note" class="text-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="done">
  </div>
  <button id="car-go" class="plate plate-btn sheet-action" type="button"></button>
  <div class="car-links">
    <button id="car-here" class="link-btn" type="button"></button>
    <button id="car-found" class="link-btn" type="button"></button>
  </div>
</section>

<!-- Choose where a simulated drive jumps to -->
<section id="steps" class="sheet sheet-stops" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <button id="steps-back" class="icon-btn" type="button"></button>
    <div class="dest-title"><h2 id="steps-title"></h2></div>
  </div>
  <ul id="steps-list" class="place-list"></ul>
</section>

<!-- My car -->
<section id="vehicle" class="fullpanel" hidden>
  <div class="panel-head">
    <button id="vehicle-back" class="icon-btn" type="button"></button>
    <h2 id="veh-title" class="panel-title"></h2>
  </div>
  <div class="panel-body panel-pad">
    <div id="veh-preview-wrap" class="veh-preview"><canvas id="veh-preview" aria-hidden="true"></canvas></div>
    <div id="veh-body-field" class="field">
      <span class="field-label" id="veh-body-label"></span>
      <div id="veh-bodies" class="segmented segmented-wrap" role="radiogroup"></div>
    </div>
    <div class="field">
      <span class="field-label" id="veh-color-label"></span>
      <div id="veh-colors" class="swatches" role="radiogroup"></div>
    </div>
    <div id="veh-preset-field" class="field">
      <label for="veh-preset" id="veh-preset-label"></label>
      <select id="veh-preset"></select>
    </div>
    <div class="field">
      <label for="veh-name" id="veh-name-label"></label>
      <input id="veh-name" type="text" maxlength="40" autocomplete="off">
    </div>
    <div class="field">
      <span class="field-label" id="veh-kind-label"></span>
      <div class="segmented" role="radiogroup">
        <button id="veh-kind-petrol" type="button" role="radio"></button>
        <button id="veh-kind-diesel" type="button" role="radio"></button>
        <button id="veh-kind-ev" type="button" role="radio"></button>
      </div>
    </div>
    <div class="field">
      <label for="veh-consumption" id="veh-consumption-label"></label>
      <div class="field-row">
        <input id="veh-consumption" type="number" inputmode="decimal" min="0" step="0.1">
        <div class="segmented" role="radiogroup" id="veh-unit-row">
          <button id="veh-unit-l100" type="button" role="radio">L/100 km</button>
          <button id="veh-unit-kml" type="button" role="radio">km/L</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="veh-range" id="veh-range-label"></label>
      <input id="veh-range" type="number" inputmode="numeric" min="0" step="10">
    </div>
    <div class="field">
      <label for="veh-level" id="veh-level-label"></label>
      <div class="level-row">
        <input id="veh-level" type="range" min="0" max="100" step="5">
        <output id="veh-level-value"></output>
      </div>
    </div>
    <div class="field">
      <label for="veh-price" id="veh-price-label"></label>
      <input id="veh-price" type="number" inputmode="decimal" min="0" step="0.01">
    </div>
    <p id="veh-note" class="tip"></p>
    <button id="veh-save" class="plate plate-btn" type="button"></button>
    <button id="veh-remove" class="link-btn center" type="button" hidden></button>
  </div>
</section>

<!-- Arrived: the door opens -->
<section id="arrival" class="arrival" hidden>
  <div class="door-scene" aria-hidden="true">
    <div class="door-light"></div>
    <div class="door-leaf"><span class="door-knob"></span></div>
  </div>
  <h2 id="arrival-title"></h2>
  <p id="arrival-place"></p>
  <p id="arrival-quip" class="arrival-quip"></p>
  <p id="arrival-stats" class="arrival-stats"></p>
  <div id="arrival-car" class="arrival-car" hidden>
    <label id="arrival-car-text" for="arrival-car-note"></label>
    <input id="arrival-car-note" class="text-input" type="text" maxlength="60" autocomplete="off" enterkeyhint="done">
  </div>
  <button id="arrival-walk" class="arrival-more" type="button" hidden></button>
  <button id="arrival-mall" class="arrival-more" type="button" hidden></button>
  <button id="arrival-done" class="plate plate-btn" type="button"></button>
</section>

<!-- Rain and floods along the route -->
<section id="weather" class="sheet sheet-stops sheet-auto" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <button id="weather-back" class="icon-btn" type="button"></button>
    <div class="dest-title"><h2 id="weather-title"></h2></div>
  </div>
  <div id="weather-rain" class="weather-rain" role="status"></div>
  <div id="weather-warnings"></div>
  <p id="weather-note" class="tip"></p>
  <div class="link-row">
    <a id="weather-rivers" class="outline-btn" target="_blank" rel="noopener"></a>
    <a id="weather-roads" class="outline-btn" target="_blank" rel="noopener"></a>
  </div>
  <p id="weather-credit" class="tip tip-small"></p>
</section>

<!-- Inside a mall -->
<section id="mall" class="sheet sheet-stops sheet-over" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <button id="mall-back" class="icon-btn" type="button"></button>
    <div class="dest-title"><h2 id="mall-title"></h2></div>
  </div>
  <div class="link-row">
    <a id="mall-map" class="outline-btn" target="_blank" rel="noopener"></a>
    <a id="mall-list" class="outline-btn" target="_blank" rel="noopener"></a>
  </div>
  <input id="mall-search" class="mall-search" type="search" autocomplete="off" hidden>
  <div id="mall-status" class="route-status" role="status"></div>
  <ul id="mall-results" class="place-list"></ul>
  <p id="mall-note" class="tip"></p>
</section>

<!-- Head-up display: read in the windscreen's reflection -->
<section id="hudmode" class="hudmode" hidden>
  <div id="hm-face" class="hm-face">
    <div class="hm-turn">
      <span id="hm-arrow" class="hm-arrow"></span>
      <div class="hm-turn-text">
        <strong id="hm-distance" class="hm-distance"></strong>
        <span id="hm-road" class="hm-road"></span>
      </div>
      <div id="hm-lanes" class="hm-lanes" hidden></div>
    </div>
    <div class="hm-bar"><span id="hm-bar-fill"></span></div>
    <div class="hm-foot">
      <div class="hm-speed"><strong id="hm-speed"></strong><span id="hm-unit"></span></div>
      <span id="hm-limit" class="limit-sign" hidden></span>
      <div class="hm-notes">
        <div id="hm-toll" class="hm-note" hidden>
          <span class="hm-note-icon" data-icon="toll"></span>
          <span class="hm-note-text"><strong><span id="hm-toll-word"></span> <span id="hm-toll-distance"></span></strong><span id="hm-toll-card"></span></span>
        </div>
        <div id="hm-rest" class="hm-note" hidden>
          <span class="hm-note-icon" data-icon="coffee"></span>
          <span class="hm-note-text"><strong id="hm-rest-word"></strong><span id="hm-rest-more"></span></span>
        </div>
      </div>
      <div id="hm-eta" class="hm-eta"></div>
    </div>
  </div>
  <div id="hm-controls" class="hm-controls">
    <p id="hm-tip"></p>
    <div id="hm-inks" class="hm-inks" role="radiogroup"></div>
    <div class="hm-buttons">
      <button id="hm-mirror" type="button"></button>
      <button id="hm-close" type="button"></button>
    </div>
  </div>
</section>

<!-- One-time note before the first trip -->
<section id="safety" class="sheet sheet-modal" hidden>
  <h2 id="safety-title"></h2>
  <p id="safety-text"></p>
  <button id="safety-ok" class="plate plate-btn" type="button"></button>
</section>

<!-- Settings -->
<section id="settings" class="fullpanel" hidden>
  <div class="panel-head">
    <button id="settings-back" class="icon-btn" type="button"></button>
    <h2 id="settings-title" class="panel-title"></h2>
  </div>
  <div class="panel-body panel-pad">
    <div class="setting">
      <h3 id="set-vehicle-title"></h3>
      <p id="set-vehicle-text" class="tip"></p>
      <button id="set-vehicle-open" class="outline-btn" type="button"></button>
    </div>
    <div class="setting">
      <h3 id="set-saved-title"></h3>
      <p id="set-saved-text" class="tip"></p>
      <ul id="saved-list" class="saved-list"></ul>
    </div>
    <div class="setting">
      <h3 id="set-lang-title"></h3>
      <div class="segmented" role="radiogroup">
        <button id="lang-ms" type="button" role="radio">Bahasa Melayu</button>
        <button id="lang-en" type="button" role="radio">English</button>
      </div>
    </div>
    <div class="setting">
      <h3 id="set-voice-title"></h3>
      <p id="voice-status" class="tip"></p>
      <button id="voice-check" class="outline-btn" type="button"></button>
      <div id="voice-report" class="voice-report" role="status"></div>
      <p id="voice-level-label" class="field-label field-gap"></p>
      <div class="segmented" role="radiogroup" id="voice-level">
        <button id="voice-full" type="button" role="radio"></button>
        <button id="voice-turns" type="button" role="radio"></button>
      </div>
      <p id="voice-char-label" class="field-label field-gap"></p>
      <ul id="voice-chars" class="char-list" role="radiogroup"></ul>
      <p id="voice-char-note" class="tip"></p>
      <button id="voice-test" class="outline-btn" type="button"></button>
      <p id="voice-wait" class="tip" role="status"></p>
      <div id="voice-try" class="voice-try">
        <p id="voice-try-label" class="field-label"></p>
        <div class="try-row">
          <button type="button" class="try-chip" data-moment="overspeed"></button>
          <button type="button" class="try-chip" data-moment="overspeed3"></button>
          <button type="button" class="try-chip" data-moment="rain"></button>
          <button type="button" class="try-chip" data-moment="jam"></button>
          <button type="button" class="try-chip" data-moment="arrive"></button>
        </div>
      </div>
    </div>
    <div class="setting">
      <h3 id="set-limit-title"></h3>
      <p id="limit-text" class="tip"></p>
      <label class="switch switch-block">
        <input id="limit-on" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span id="limit-on-label"></span>
      </label>
    </div>
    <div class="setting">
      <h3 id="set-camera-title"></h3>
      <p id="camera-text" class="tip"></p>
      <label class="switch switch-block">
        <input id="camera-on" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span id="camera-on-label"></span>
      </label>
    </div>
    <div class="setting">
      <h3 id="set-weather-title"></h3>
      <p id="weather-text" class="tip"></p>
      <label class="switch switch-block">
        <input id="weather-on" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span id="weather-on-label"></span>
      </label>
    </div>
    <div class="setting">
      <h3 id="set-theme-title"></h3>
      <div class="segmented" role="radiogroup">
        <button id="theme-auto" type="button" role="radio"></button>
        <button id="theme-day" type="button" role="radio"></button>
        <button id="theme-night" type="button" role="radio"></button>
      </div>
    </div>
    <div class="setting">
      <h3 id="set-solat-title"></h3>
      <p id="solat-text" class="tip"></p>
      <label class="switch switch-block">
        <input id="solat-on" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span id="solat-on-label"></span>
      </label>
    </div>
    <div class="setting">
      <h3 id="set-install-title"></h3>
      <p id="install-text" class="tip"></p>
      <button id="install-btn" class="outline-btn" type="button" hidden></button>
    </div>
    <div class="setting">
      <h3 id="set-privacy-title"></h3>
      <p id="privacy-text" class="tip"></p>
    </div>
    <div class="setting">
      <h3 id="set-credits-title"></h3>
      <p class="tip">
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>,
        <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a>,
        <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a>,
        <a href="https://maplibre.org/" target="_blank" rel="noopener">MapLibre</a>,
        <a href="https://github.com/valhalla/valhalla" target="_blank" rel="noopener">Valhalla</a>,
        <a href="https://github.com/komoot/photon" target="_blank" rel="noopener">Photon</a>,
        <a href="https://overpass-api.de/" target="_blank" rel="noopener">Overpass</a>,
        <a href="https://api.waktusolat.app/" target="_blank" rel="noopener">Waktu Solat API</a>
        (JAKIM e-Solat),
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">weather data by Open-Meteo.com</a>,
        <a href="https://developer.data.gov.my/" target="_blank" rel="noopener">MET Malaysia via data.gov.my</a>.
      </p>
      <p id="version" class="tip"></p>
    </div>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="speak-live" class="sr-only" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
