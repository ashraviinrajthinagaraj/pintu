# Temporary: which Overpass servers hold Malaysia.
name: Overpass probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask Overpass
        run: |
          Q='[out:json][timeout:25];node["amenity"="fuel"](3.10,101.65,3.20,101.75);out center tags 3;'
          for s in https://ovp.dresel.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $s"
            curl -sS -m 45 -A "Mozilla/5.0 PintuProbe/1.0" -H "Origin: https://ashraviinrajthinagaraj.github.io" -w "\nHTTP %{http_code} %{time_total}s\n" --data-urlencode "data=$Q" "$s" | tr -d '\n' | head -c 500; echo
          done
