# Temporary: what the dresel Overpass server covers.
name: Overpass probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask Overpass
        run: |
          for bbox in "52.50,13.38,52.53,13.43" "3.10,101.65,3.20,101.75"; do
            Q="[out:json][timeout:25];node[\"amenity\"=\"fuel\"]($bbox);out center tags 2;"
            for s in https://ovp.dresel.systems/api/interpreter https://overpass-api.de/api/interpreter; do
              echo "== $bbox $s"
              curl -sS -m 45 -A "Mozilla/5.0 PintuProbe/1.0" -H "Accept: application/json" -H "Origin: https://ashraviinrajthinagaraj.github.io" --data-urlencode "data=$Q" "$s" | tr -d '\n ' | sed 's/.*"elements":/elements:/' | head -c 260; echo
            done
          done
