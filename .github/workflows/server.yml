# Updates the small server on Cloudflare whenever its code changes here.
name: Update the server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'wrangler.toml'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret yet, so nothing to do."
            exit 0
          fi
          npx --yes wrangler@4 deploy
