# Updates the small server on Cloudflare whenever its code changes here.
name: Update the server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'wrangler.toml'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning title=No token::No CLOUDFLARE_API_TOKEN secret yet, so the server wasn't updated."
            exit 0
          fi
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            grep -E "ERROR|✘|code: [0-9]+" deploy.log | head -6 | while IFS= read -r line; do echo "::error title=Deploy failed::${line}"; done
            exit 1
          fi
          echo "::notice title=Deployed::The server was updated."
