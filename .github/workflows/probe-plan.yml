name: Temporary probe - public transport trips
on:
  push:
    branches: [main]
    paths: ['.github/probe/**', '.github/workflows/probe-plan.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/probe/plan.mjs
