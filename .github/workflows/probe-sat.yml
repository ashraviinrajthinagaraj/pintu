# Temporary: checks the server's satellite tiles work with the real key.
name: Probe satellite
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-sat.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in 17/102563/64388 15/25640/16097 19/410253/257553; do
            curl -s -o tile.jpg -w "$t status=%{http_code} type=%{content_type} bytes=%{size_download}\n" -H 'Origin: https://ashraviinrajthinagaraj.github.io' "https://pintu.ashraviinrajthinagaraj.workers.dev/tiles/sat/$t.jpg"
            file tile.jpg || true
          done
