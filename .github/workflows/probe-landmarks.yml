# Temporary: what the map's tiles and OpenStreetMap say about a few landmarks.
name: Probe landmarks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-landmarks.yml', '.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd .github/probe && npm init -y >/dev/null && npm i @mapbox/vector-tile@2 pbf@4 >/dev/null 2>&1 && node landmarks.mjs
