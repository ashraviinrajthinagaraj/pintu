# Keeps data/along.json up to date: Malaysia's toll plazas, speed cameras, R&Rs
# and lay-bys from OpenStreetMap, which the route screen uses straight away
# instead of asking a map server and waiting. Runs every Monday morning.
name: Toll, camera and R&R data

on:
  schedule:
    - cron: '17 19 * * 0'    # Monday 03:17 in Malaysia
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/along-data.mjs'
      - '.github/workflows/along-data.yml'

permissions:
  contents: write

concurrency:
  group: along-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from OpenStreetMap
        run: node scripts/along-data.mjs
      - name: Save if changed
        run: |
          if git diff --quiet -- data/along.json && git ls-files --error-unmatch data/along.json >/dev/null 2>&1; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/along.json
          git commit -m "Update toll, camera and R&R data from OpenStreetMap"
          git pull --rebase origin main
          git push origin HEAD:main
