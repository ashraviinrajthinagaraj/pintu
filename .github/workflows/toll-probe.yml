# Temporary: what the Malaysian Highway Authority publishes about toll plazas and fares.
name: Toll data probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask LLM
        run: |
          curl -sSL -m 30 -A "Mozilla/5.0" "https://www.llm.gov.my/" -o site.html
          echo "== links"; grep -oiE 'href="https?://www\.llm\.gov\.my/[^"]*"|href="/[^"]*"' site.html | sort -u | grep -viE '\.(pdf|jpg|png|css|js)"' | head -120
          R=https://gis02.llm.gov.my/llmsmpt/rest/services/GIS_LLM/KAW_REHAT_RAWAT/MapServer
          echo "== RnR"; curl -sS -m 30 "$R?f=json" | head -c 1500; echo
          curl -sS -m 30 "$R/0?f=json" | grep -oE '"name":"[A-Z_0-9]+"' | tr '\n' ' '; echo
          curl -sS -m 30 "$R/0/query?where=1%3D1&returnCountOnly=true&f=json"; echo
          curl -sS -m 30 "$R/0/query?where=1%3D1&outFields=*&resultRecordCount=3&f=json" | head -c 2500; echo
