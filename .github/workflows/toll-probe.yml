# Temporary: what the Malaysian Highway Authority publishes about toll plazas and fares.
name: Toll data probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask LLM
        run: |
          A="Mozilla/5.0"
          curl -sSL -m 30 -A "$A" "https://www.llm.gov.my/awam/highway" -o hw.html
          echo "== options"; grep -oiE '<option[^>]*value="[0-9]+"[^>]*>[^<]*' hw.html | head -60
          curl -sSL -m 30 -A "$A" "https://www.llm.gov.my/awam/highway/8" -o d.html
          python3 - <<'PY'
          import re,html
          s=open('d.html',encoding='utf-8',errors='ignore').read()
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',s)
          i=s.find('Plaza Tol Loke Yew')
          seg=s[max(0,i-6000):i+6000]
          seg=re.sub(r'(?i)<img[^>]*src="([^"]*)"[^>]*>',r' [IMG \1] ',seg)
          t=html.unescape(re.sub(r'<[^>]+>','\n',seg))
          lines=[l.strip() for l in t.split('\n') if l.strip()]
          print('\n'.join(lines)[:5000])
          PY
