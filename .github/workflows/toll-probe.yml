# Temporary: what the Malaysian Highway Authority publishes about toll plazas and fares.
name: Toll data probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask LLM
        run: |
          G=https://gis02.llm.gov.my/llmsmpt/rest/services
          echo "== GIS root"; curl -sS -m 30 "$G?f=json" | head -c 2000; echo
          echo "== GIS folder"; curl -sS -m 30 "$G/GIS_LLM?f=json" | head -c 4000; echo
          echo "== Site"; curl -sSL -m 30 -A "Mozilla/5.0" "https://www.llm.gov.my/" -o site.html; wc -c site.html
          grep -oiE 'href="[^"]*"' site.html | grep -iE 'tol|kadar|rate|fare' | sort -u | head -60
          for p in "/awam/kadartol" "/awam/kadar-tol" "/en/kadar-tol" "/kadar-tol" "/tol"; do
            echo "== $p"; curl -sSL -m 20 -A "Mozilla/5.0" -o /dev/null -w "%{http_code} %{url_effective}\n" "https://www.llm.gov.my$p"
          done
