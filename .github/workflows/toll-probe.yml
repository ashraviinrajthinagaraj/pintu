# Temporary: what the Malaysian Highway Authority publishes about toll plazas and fares.
name: Toll data probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask LLM
        run: |
          A="Mozilla/5.0"
          curl -sSL -m 30 -A "$A" "https://www.llm.gov.my/awam/highway" -o hw.html; wc -c hw.html
          echo "== links"; grep -oiE 'href="[^"]*"' hw.html | sort -u | grep -iE 'highway|lebuh|tol|kadar' | head -80
          echo "== text"; sed -e 's/<[^>]*>/ /g' hw.html | tr -s ' \t' ' ' | grep -iE 'kadar|tol|RM' | head -40 | cut -c1-300
          L=$(grep -oiE 'href="[^"]*highway[^"]*/[0-9]+[^"]*"' hw.html | head -1 | sed 's/href="//;s/"$//')
          echo "== first detail: $L"
          if [ -n "$L" ]; then curl -sSL -m 30 -A "$A" "$L" -o d.html; sed -e 's/<[^>]*>/ /g' d.html | tr -s ' \t' ' ' | grep -iE 'kadar|kelas|RM|plaza' | head -60 | cut -c1-400; grep -oiE 'href="[^"]*"' d.html | grep -iE 'kadar|tol|pdf' | head -20; fi
