# Temporary: what OpenStreetMap has.
name: Probe links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-links.yml', '.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/probe/links.mjs
