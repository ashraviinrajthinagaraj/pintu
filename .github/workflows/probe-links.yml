# Temporary: the server's far-away copies following a share link.
name: Probe links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-links.yml', '.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/probe/links.mjs
