# Temporary: pasting Google Maps share links into the live Pintu.
name: Probe links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-links.yml', '.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd .github/probe && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 && node links.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: .github/probe/*.png
