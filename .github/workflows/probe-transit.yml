name: Temporary probe - live buses and trains
on:
  push:
    branches: [main]
    paths: ['.github/probe/**', '.github/workflows/probe-transit.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd .github/probe && echo '{"type":"module"}' > package.json && node live.mjs
