# Lets Cloudflare update the server by itself whenever this repository changes.
# Used when the Worker's root directory is left as it is. See also server/wrangler.toml.
name = "pintu"
main = "server/worker.js"
compatibility_date = "2025-09-01"
# Anything added in Cloudflare's dashboard stays as it is. Secrets always do.
keep_vars = true
